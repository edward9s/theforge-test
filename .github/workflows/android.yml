name: Android test build
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: theforge-test
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
          cache-disabled: true
      - name: Prepare release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          umask 077
          key="$RUNNER_TEMP/theforge-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$key"
          test -s "$key"
          keytool -list -keystore "$key" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null
      - name: Install Android SDK and NDK
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.3.13750724"
      - name: Print source and reference revisions
        run: |
          git rev-parse HEAD
          cat assets/reference.json
      - name: Fetch pinned The Forge and GLM
        run: bash scripts/deps.sh
      - name: Validate geometry and effects
        run: bash scripts/test.sh
      - name: Compile Vulkan shaders
        run: bash scripts/shaders.sh
      - name: Prepare reference textures and environment
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6
          python3 scripts/assets.py
          python3 tests/assets.py
      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/theforge-release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Verify APK
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          unzip -tqq "$apk"
          "$tools/aapt2" dump badging "$apk"
          "$tools/zipalign" -c -P 16 4 "$apk"
          "$tools/apksigner" verify --verbose "$apk"
          python3 scripts/check-apk.py "$apk"
          unzip -p "$apk" lib/arm64-v8a/libmain.so > "$RUNNER_TEMP/forge-main.so"
          "$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" --dyn-syms "$RUNNER_TEMP/forge-main.so" | grep -E '[[:space:]]ANativeActivity_onCreate([[:space:]]|$)'
          cp "$apk" TheForge-test-arm64.apk
      - name: Replace rolling test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=test-build
          apk=TheForge-test-arm64.apk
          digest="$(sha256sum "$apk" | cut -d ' ' -f1)"
          reference="$(python3 -c 'import json; r=json.load(open("assets/reference.json")); print(r["branch"] + " @ " + r["commit"])')"
          notes="Latest successful build #${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA}.
          The Forge cd504689 / Vulkan 1.1, arm64 release signed with the repository key.
          Filament reference: ${reference}
          Workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          SHA-256: ${digest}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber --repo "$GITHUB_REPOSITORY"
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "The Forge forest test (latest #${GITHUB_RUN_NUMBER})" --notes "$notes" --prerelease --latest=false
          else
            gh release create "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --title "The Forge forest test (latest #${GITHUB_RUN_NUMBER})" --notes "$notes" --prerelease --latest=false --target "$GITHUB_SHA"
          fi
      - name: Remove signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/theforge-release.jks"
