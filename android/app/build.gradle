plugins { id 'com.android.application' }
android {
    namespace 'com.edward9s.theforgetest'
    compileSdk 35
    ndkVersion '27.3.13750724'
    defaultConfig {
        applicationId 'com.edward9s.theforgetest'
        minSdk 28
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }
    signingConfigs {
        release {
            def path = System.getenv('KEYSTORE_PATH')
            if (path) {
                storeFile file(path)
                storePassword System.getenv('STORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; debuggable false; minifyEnabled false }
        debug { debuggable true }
    }
    externalNativeBuild { cmake { path '../../CMakeLists.txt'; version '3.22.1' } }
    sourceSets { main { assets.srcDirs = ['../../.generated/assets'] } }
    packaging { jniLibs { useLegacyPackaging = false } }
}
tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') task.doFirst {
        ['KEYSTORE_PATH', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD'].each { name ->
            if (!System.getenv(name)) throw new GradleException("Missing release signing variable: $name")
        }
    }
}
